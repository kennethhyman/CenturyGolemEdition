name: ci

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    working-directory: game

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: game/go.mod

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: game/go.mod

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: game
          # Known findings pre-date the hexagonal restructure and live in files
          # slated for rework in later stages (see PLAN.md). Non-blocking until
          # those stages land; do not silently widen this without updating PLAN.md.
          args: --issues-exit-code=0
