name: ci

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    working-directory: game

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: game/go.mod

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -v

  lint:
    runs-on: ubuntu-latest
    # Non-blocking: known pre-existing findings live in files slated for
    # rework in later stages (see PLAN.md), AND as of go 1.27 golangci-lint
    # (latest: v1.64.8) can't yet parse this toolchain's export data format
    # and exits nonzero on its own runner error, independent of any issues
    # found. continue-on-error tolerates both cases; --issues-exit-code=0
    # only covers the former. Remove continue-on-error once golangci-lint
    # ships go1.27 support upstream and re-verify locally first.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: game/go.mod

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: game
          args: --issues-exit-code=0
