syntax = "proto3";

option go_package = "khyman.dev/grpc/century-golem/grpc";
option java_package = "dev.khyman.grpc.century-golem.game";
option java_outer_classname = "CenturyGolemProto";


package grpc;

// Interface exported by the server.
service Game {
  // Pick up a gem card from the lineup (paying one gem per card bypassed).
  rpc GetCard(GetCardMessage) returns (GetCardResponse) {}
  rpc NewGame(CreateGameMessage) returns (CreateGameResponse) {}
  rpc PlayGemCard(PlayGemCardMessage) returns (PlayGemCardResponse) {}
  // Buy a golem card from the lineup.
  rpc BuyGolem(BuyGolemMessage) returns (BuyGolemResponse) {}
  // End the current player's turn, discarding down to 10 gems if required.
  rpc Rest(RestMessage) returns (RestResponse) {}
  // A server-to-client streaming RPC.
  //
  // Obtains the Features available within the given Rectangle.  Results are
  // streamed rather than returned at once (e.g. in a response message with a
  // repeated field), as the rectangle may cover a large area and contain a
  // huge number of features.
  /* rpc GetGame(GameId) returns (GetGameResponse) {} */

  /* // A client-to-server streaming RPC. */
  /* // */
  /* // Accepts a stream of Points on a route being traversed, returning a */
  /* // RouteSummary when traversal is completed. */
  /* rpc GetActions(GameId) returns (stream GameAction) {} */

  /* // A Bidirectional streaming RPC. */
  /* // */
  /* // Accepts a stream of RouteNotes sent while a route is being traversed, */
  /* // while receiving other RouteNotes (e.g. from other users). */
  /* rpc PlayAction(GameAction) returns (Game) {} */
}

message GetCardMessage {
  string game_id = 1;
  int32 player = 2;
  // The lineup card the player wants to pick up (matched by value against
  // the current gem lineup).
  GemCard card = 3;
  // One gem letter (y/g/b/p) per lineup card bypassed to reach `card`.
  string payment = 4;
}

message GetCardResponse {
  GameState game_state = 1;
}

message GemValues {
  int32 yellow = 1;
  int32 green = 2;
  int32 blue = 3;
  int32 pink = 4;
}

message GemCard {
  GemValues in = 1;
  GemValues out = 2;
  int32    upgrades = 3;
}

message GolemCard {
  GemValues cost = 1;
  int32 points = 2;
}

message CreateGameMessage {
  int32 player_count = 1;
}

message CreateGameResponse {
  GameState game_state = 1;
}

message GameState{
  // The game this state belongs to — a client must pass this back as
  // `game_id` on every subsequent request. It is the only place a client
  // ever learns a newly created game's ID.
  string game_id = 1;
  // Index into the game's player list whose turn it currently is — the
  // index a client must pass back as `player` on its next request.
  int32 current_player = 2;
  repeated Player other_players = 3;
  repeated GemCard gem_lineup = 4;
  int32 gem_deck_size = 5;
  repeated GolemCard golem_lineup = 6;
  int32 golem_deck_size = 7;
  repeated GemValues player_gems = 8;
  int32 gold_coins = 9;
  int32 silver_coins = 10;
  // The current player's own view (hand, golems, coins, gems).
  Player player = 11;
}

message PlayGemCardMessage {
  string game_id = 1;
  int32 player = 2;
  GemCard card = 3;
  GemValues discarded = 4;
}

message PlayGemCardResponse {
  GameState game_state = 1;
}

message BuyGolemMessage {
  string game_id = 1;
  int32 player = 2;
  // The lineup golem the player wants to buy (matched by value against the
  // current golem lineup).
  GolemCard golem = 3;
}

message BuyGolemResponse {
  GameState game_state = 1;
}

message RestMessage {
  string game_id = 1;
  int32 player = 2;
  // Gems to discard, one letter (y/g/b/p) per gem, if the current player
  // holds more than 10 gems. Ignored (must be empty) otherwise.
  string discards = 3;
}

message RestResponse {
  GameState game_state = 1;
}

message Player {
  int32 gold_coins = 1;
  int32 silver_coins = 2;
  GemValues gems = 3;
  repeated GolemCard golems = 4;
  repeated GemCard hand = 5;
  repeated GemCard discard_pile = 6;
}
